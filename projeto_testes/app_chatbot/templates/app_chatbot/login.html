<!DOCTYPE html>
<html lang="pt-br" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acesso ao Terminal // Autenticação</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #06090e;
            color: #e6edf3;
            font-family: 'SF Mono', 'Fira Code', 'Cascadia Code', monospace;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .login-card {
            background-color: #0d1117;
            border: 1px solid rgba(0, 255, 102, 0.25);
            border-radius: 8px;
            box-shadow: 0 0 30px rgba(0, 255, 102, 0.08);
            width: 100%;
            max-width: 440px;
        }
        .login-header {
            background-color: #090d13;
            border-bottom: 1px solid rgba(0, 255, 102, 0.2);
            padding: 14px 20px;
            color: #00ff66;
            font-size: 0.9rem;
        }
        .terminal-input {
            background-color: #090d13 !important;
            border: 1px solid rgba(0, 255, 102, 0.3) !important;
            color: #00ff66 !important;
            font-family: inherit;
        }
        .terminal-input:focus {
            box-shadow: 0 0 10px rgba(0, 255, 102, 0.35) !important;
        }
        .btn-neon {
            background-color: #00ff66;
            color: #06090e;
            font-weight: 700;
            border: none;
            letter-spacing: 0.5px;
            transition: all 0.2s ease;
        }
        .btn-neon:hover {
            background-color: #00cc52;
            color: #000000;
        }
        .status-dot {
            width: 8px;
            height: 8px;
            background-color: #00ff66;
            border-radius: 50%;
            display: inline-block;
            box-shadow: 0 0 6px #00ff66;
        }
    </style>
</head>
<body>
    <div class="login-card p-0">
        <div class="login-header d-flex justify-content-between align-items-center">
            <div class="d-flex align-items-center gap-2">
                <span class="status-dot"></span>
                <span class="fw-bold">&gt;_</span> AUTH GATEWAY // TERMINAL
            </div>
            <span class="badge bg-black text-success border border-success border-opacity-25 font-monospace">SECURE</span>
        </div>

        <div class="p-4">
            <div class="mb-4 text-center">
                <h5 class="text-success mb-1">&gt; ACESSO RESTRITO</h5>
                <p class="text-secondary small mb-0">Identifique-se para carregar suas sessões de conversa salvas.</p>
            </div>

            {% if erro %}
            <div class="alert alert-danger py-2 small bg-danger bg-opacity-10 border border-danger border-opacity-25 text-danger font-monospace" role="alert">
                &gt; ERRO: {{ erro }}
            </div>
            {% endif %}

            <form method="POST" action="{% url 'app_chatbot:login' %}">
                {% csrf_token %}
                <input type="hidden" name="next" value="{{ next|default:'' }}">

                <div class="mb-3">
                    <label for="username" class="form-label text-secondary small">&gt; Usuário (Username):</label>
                    <input type="text" name="username" id="username" class="form-control terminal-input" required autofocus autocomplete="username">
                </div>

                <div class="mb-4">
                    <label for="password" class="form-label text-secondary small">&gt; Senha (Password):</label>
                    <input type="password" name="password" id="password" class="form-control terminal-input" required autocomplete="current-password">
                </div>

                <button type="submit" class="btn btn-neon w-100 py-2">
                    [ AUTENTICAR NO SISTEMA ]
                </button>
            </form>
        </div>

        <div class="px-4 py-2 bg-black bg-opacity-40 border-top border-secondary border-opacity-10 text-center">
            <span class="text-secondary" style="font-size: 0.75rem;">SQLite Episodic + ChromaDB Semantic Storage</span>
        </div>
    </div>
</body>
</html>
