[tool.pyrefly]
search-path = [
    ".",
    "bdpratico",
    "projeto_testes",
    "BigData-env/lib/python3.14/site-packages"
]
site-package-path = [
    "BigData-env/lib/python3.14/site-packages"
]
replace-untyped-imports-with-any = [
    "django.*"
]

[tool.pyright]
venvPath = "."
venv = "BigData-env"
extraPaths = [
    "BigData-env/lib/python3.14/site-packages",
    "bdpratico",
    "projeto_testes"
]
reportMissingTypeStubs = false
